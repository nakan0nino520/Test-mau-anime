<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Anime Schedule - Full Version</title>
<style>
:root {
    --bg:#f2f2f7; --card:#fff; --label:#000; --label2:#3c3c43; --label3:#6c6c70;
    --sep:#3c3c4333; --accent:#007aff; --green:#248a3d; --red:#d70015; --orange:#c93400;
    --fill:#7676801f; --radius:12px; --radius-lg:16px; --icon-bg:#007aff1f;
}
@media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --label:#fff; --label2:#ebebf5;
            --label3:#98989d; --sep:#54545899; --accent:#0a84ff;
            --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
            --fill:#7676803d; --icon-bg:#0a84ff2e; }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; }
body {
    background:var(--bg); color:var(--label);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
    font-size: clamp(16px, 4.2vw, 19px); line-height:1.4;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
}
body[data-fontsize="small"] { font-size:14px; }
body[data-fontsize="large"] { font-size:20px; }
img { image-rendering: -webkit-optimize-contrast; }

.nav {
    position:sticky; top:0; z-index:30;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom:0.5px solid transparent; transition:border-color .2s ease;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
}
.nav.scrolled { border-bottom-color:var(--sep); }
.nav .nav-row { display:flex; align-items:center; gap:8px; min-height:44px; }
.nav .nav-row .back-btn { border:0; background:transparent; color:var(--accent); font-size:22px; cursor:pointer; min-width:44px; min-height:44px; padding:0 8px; display:none; }
.nav.back .nav-row .back-btn { display:block; }
.nav .nav-row .title-inline { flex:1; font-size:17px; font-weight:600; text-align:center; opacity:0; transition:opacity .2s ease; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav.scrolled .nav-row .title-inline { opacity:1; }
.nav .nav-row .action-btn { border:0; background:transparent; color:var(--accent); font-size:17px; font-family:inherit; cursor:pointer; min-width:44px; min-height:44px; padding:0 8px; }
.nav .large-title { margin:4px 0 0; font-size: clamp(28px,8vw,40px); font-weight:700; letter-spacing:0.37px; }
.nav.scrolled .large-title, .nav.back .large-title { display:none; }

.search-wrap { padding:12px 16px 0; }
.search { display:flex; align-items:center; gap:8px; background:var(--fill); border-radius:10px; padding:0 12px; height:44px; }
.search svg { flex:0 0 20px; width:20px; height:20px; fill:var(--label3); }
.search input { flex:1; border:0; outline:0; background:transparent; color:var(--label); font-size:inherit; font-family:inherit; height:100%; }
.search input::placeholder { color:var(--label3); }

.chips { display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:0 0 auto; height:34px; padding:0 14px; border:0.5px solid var(--sep); border-radius:999px; background:var(--card); color:var(--label); font-size:15px; font-family:inherit; cursor:pointer; white-space:nowrap; }
.chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }

.hero { position:relative; margin:8px 16px 0; border-radius:var(--radius-lg); overflow:hidden; aspect-ratio:16/9; background:var(--fill); }
.hero img { width:100%; height:100%; object-fit:cover; display:block; }
.hero-overlay { position:absolute; inset:0; background:linear-gradient(to top, #000d 0%, #0008 40%, transparent 100%); display:flex; flex-direction:column; justify-content:flex-end; padding:16px; }
.hero-overlay h2 { margin:0 0 4px; color:#fff; font-size:22px; font-weight:700; }
.hero-overlay p { margin:0 0 10px; color:#fffc; font-size:14px; }
.hero-overlay .btn { width:auto; padding:0 20px; margin:0; height:40px; }

.section { margin-top:24px; }
.section-head { display:flex; justify-content:space-between; align-items:baseline; padding:0 16px 8px; }
.section-head h3 { margin:0; font-size:20px; font-weight:700; }
.section-head button { border:0; background:transparent; color:var(--accent); font-size:15px; font-weight:600; cursor:pointer; }
.hscroll { display:flex; gap:12px; overflow-x:auto; padding:0 16px 4px; scrollbar-width:none; scroll-snap-type:x mandatory; }
.hscroll::-webkit-scrollbar { display:none; }
.poster { flex:0 0 140px; scroll-snap-align:start; cursor:pointer; background:var(--card); border-radius:var(--radius); overflow:hidden; border:0; text-align:left; color:var(--label); font-family:inherit; padding:0; }
.poster .img-wrap { position:relative; width:100%; aspect-ratio:2/3; background:var(--fill); overflow:hidden; }
.poster .img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
.poster .score-badge { position:absolute; top:6px; right:6px; background:#000b; color:#fff; padding:3px 7px; border-radius:6px; font-size:12px; font-weight:700; }
.poster .info { padding:8px 10px 10px; }
.poster .t { font-size:14px; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.poster .m { font-size:12px; color:var(--label2); margin-top:3px; }

.list { margin:8px 16px 0; background:var(--card); border-radius:var(--radius); overflow:hidden; }
.row { display:flex; align-items:center; gap:12px; padding:0 16px; min-height:64px; border-bottom:0.5px solid var(--sep); cursor:pointer; background:var(--card); text-align:left; width:100%; border:0; color:var(--label); font-family:inherit; font-size:inherit; }
.row:last-child { border-bottom:0; }
.row .thumb { flex:0 0 44px; width:44px; height:60px; border-radius:8px; background:var(--fill); overflow:hidden; }
.row .thumb img { width:100%; height:100%; object-fit:cover; }
.row .txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.row .title { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .desc { font-size:14px; color:var(--label2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .countdown { font-size:13px; font-weight:600; color:var(--accent); }
.row .countdown.soon { color:var(--orange); }
.row .chevron { flex:0 0 8px; width:8px; height:8px; border-right:1.5px solid var(--label3); border-top:1.5px solid var(--label3); transform:rotate(45deg); }

.btn { width:calc(100% - 32px); margin:20px 16px 0; height:50px; border:0; border-radius:var(--radius); background:var(--accent); color:#fff; font-size:17px; font-weight:600; font-family:inherit; cursor:pointer; }
.btn-secondary { width:calc(100% - 32px); margin:8px 16px 0; height:44px; border:0; border-radius:var(--radius); background:transparent; color:var(--accent); font-size:17px; font-weight:500; font-family:inherit; cursor:pointer; }

.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; justify-content:space-around; align-items:flex-start; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-top:0.5px solid var(--sep); }
.tabbar .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; border:0; background:transparent; color:var(--label3); font-size:10px; font-family:inherit; cursor:pointer; padding:4px 0; min-height:44px; }
.tabbar .tab svg { width:24px; height:24px; fill:currentColor; }
.tabbar .tab.active { color:var(--accent); }
.tabbar .tab.active svg { fill:var(--accent); }

.detail-page { position:fixed; inset:0; z-index:45; background:var(--bg); overflow-y:auto; transform:translateX(100%); transition:transform .28s cubic-bezier(.32,.72,0,1); padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
.detail-page.open { transform:translateX(0); }
.detail-page .detail-nav { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top) + 8px) 16px 8px; background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:0.5px solid var(--sep); }
.detail-page .detail-nav button { border:0; background:transparent; color:var(--accent); font-size:22px; cursor:pointer; min-width:44px; min-height:44px; padding:0 8px; font-family:inherit; }
.detail-page .detail-nav .detail-title { flex:1; font-size:16px; font-weight:600; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.segmented { position:sticky; top:calc(env(safe-area-inset-top) + 60px); z-index:1; display:flex; gap:0; margin:8px 16px; background:var(--fill); border-radius:10px; padding:3px; overflow-x:auto; scrollbar-width:none; }
.segmented::-webkit-scrollbar { display:none; }
.segmented button { flex:0 0 auto; border:0; background:transparent; color:var(--label); font-size:14px; font-weight:500; font-family:inherit; padding:0 14px; height:32px; border-radius:8px; cursor:pointer; white-space:nowrap; }
.segmented button.active { background:var(--card); font-weight:600; box-shadow:0 1px 3px #0002; }

.detail-banner { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
.detail-head { display:flex; gap:12px; padding:0 16px; margin-top:-48px; position:relative; }
.detail-head .poster-img { width:100px; height:150px; border-radius:var(--radius); object-fit:cover; box-shadow:0 4px 12px #0004; background:var(--fill); flex:0 0 100px; }
.detail-head .meta-col { flex:1; padding-top:52px; min-width:0; }
.detail-head h2 { margin:0 0 4px; font-size:20px; font-weight:700; line-height:1.25; }
.detail-section { padding:0 16px 16px; }
.detail-section h3 { font-size:17px; font-weight:700; margin:16px 0 8px; padding-top:16px; border-top:0.5px solid var(--sep); }
.detail-section h3:first-child { border-top:0; padding-top:0; margin-top:8px; }
.detail-section p { margin:0; font-size:15px; line-height:1.5; color:var(--label2); white-space:pre-wrap; }
.info-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.info-item { background:var(--card); border-radius:10px; padding:10px 12px; }
.info-item .lbl { font-size:12px; color:var(--label2); text-transform:uppercase; }
.info-item .val { font-size:15px; font-weight:600; color:var(--label); margin-top:2px; }
.tag-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.tag { font-size:13px; padding:4px 10px; border-radius:999px; background:var(--fill); color:var(--label); }
.tag.accent { background:var(--icon-bg); color:var(--accent); font-weight:600; }
.char-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:12px; }
.char-item { text-align:center; background:transparent; border:0; color:var(--label); padding:0; cursor:pointer; }
.char-item img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:50%; background:var(--fill); }
.char-item .n { font-size:13px; font-weight:600; margin-top:6px; }
.char-item .r { font-size:11px; color:var(--label2); }
.rel-list { display:flex; flex-direction:column; gap:8px; }
.rel-item { display:flex; gap:10px; align-items:center; padding:8px; background:var(--card); border-radius:var(--radius); cursor:pointer; border:0; text-align:left; color:var(--label); font-family:inherit; font-size:inherit; width:100%; }
.rel-item img { width:44px; height:60px; border-radius:6px; object-fit:cover; background:var(--fill); flex:0 0 44px; }
.rel-item .n { font-size:14px; font-weight:600; }
.rel-item .rt { font-size:12px; color:var(--label2); }
.status-buttons { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
input.rating-input, textarea.notes-input { width:100%; border:0.5px solid var(--sep); border-radius:10px; padding:10px 12px; background:var(--card); color:var(--label); font-family:inherit; font-size:16px; margin-top:8px; }
textarea.notes-input { min-height:80px; resize:vertical; }

.sheet-backdrop { position:fixed; inset:0; background:#00000066; z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.sheet-backdrop.open { opacity:1; pointer-events:auto; }
.sheet { position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--bg); border-radius:14px 14px 0 0; padding:0 0 calc(20px + env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto; transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1); }
.sheet.open { transform:translateY(0); }
.sheet .grabber { width:36px; height:5px; border-radius:3px; background:var(--label3); opacity:.4; margin:8px auto 0; }
.sheet .sheet-nav { display:flex; justify-content:space-between; align-items:center; padding:8px 16px; border-bottom:0.5px solid var(--sep); position:sticky; top:0; background:var(--bg); z-index:2; }
.sheet .sheet-nav button { border:0; background:transparent; color:var(--accent); font-size:17px; font-family:inherit; cursor:pointer; padding:8px; min-height:44px; }
.sheet .sheet-nav .title { font-size:17px; font-weight:600; }
.sheet .sheet-body { padding:16px; }

.toast { position:fixed; left:50%; bottom:calc(100px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); opacity:0; background:#000d; color:#fff; padding:10px 16px; border-radius:10px; font-size:15px; z-index:60; pointer-events:none; transition:opacity .25s; max-width:calc(100% - 32px); text-align:center; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.success { background:var(--green); }
.toast.error { background:var(--red); }
</style>
</head>
<body data-fontsize="default">

<header class="nav" id="nav" role="banner">
    <div class="nav-row">
        <button class="back-btn" id="navBack" aria-label="Quay lại">‹</button>
        <span class="title-inline" id="navInline">Anime</span>
        <button class="action-btn" id="navAction" aria-label="Hành động">Làm mới</button>
    </div>
    <h1 class="large-title" id="largeTitle">Anime</h1>
</header>

<div class="search-wrap" id="searchWrap">
    <label class="search">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.29 14.01l4.35 4.35 1.42-1.42-4.35-4.35A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
        <input id="q" type="search" placeholder="Tìm anime..." autocomplete="off">
    </label>
</div>

<div class="chips" id="seasonChips">
    <button class="chip active" data-season="now">Mùa này</button>
    <button class="chip" data-season="WINTER">Đông</button>
    <button class="chip" data-season="SPRING">Xuân</button>
    <button class="chip" data-season="SUMMER">Hạ</button>
    <button class="chip" data-season="FALL">Thu</button>
</div>

<main id="main" role="main"></main>

<nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3l9-8z"/></svg><span>Trang chủ</span>
    </button>
    <button class="tab" data-tab="schedule">
        <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H5V8h14v13z"/></svg><span>Lịch</span>
    </button>
    <button class="tab" data-tab="search">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105.29 14.01l4.35 4.35 1.42-1.42-4.35-4.35A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg><span>Khám phá</span>
    </button>
    <button class="tab" data-tab="saved">
        <svg viewBox="0 0 24 24"><path d="M6 4h12v18l-6-4-6 4V4z"/></svg><span>Đã lưu</span>
    </button>
    <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/></svg><span>Cài đặt</span>
    </button>
</nav>

<div class="detail-page" id="detailPage">
    <div class="detail-nav">
        <button id="detailBack">‹</button>
        <span class="detail-title" id="detailTitle">Chi tiết</span>
        <button id="detailShare">↗</button>
    </div>
    <div id="detailBody"></div>
</div>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
    <div class="grabber"></div>
    <div class="sheet-nav">
        <button id="sheetClose">Đóng</button>
        <span class="title" id="sheetTitle">Tùy chọn</span>
        <button id="sheetAction" style="visibility:hidden">Xong</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const nav = $('nav'), qEl = $('q'), mainEl = $('main');
const seasonChips = $('seasonChips'), tabbar = $('tabbar');
const backdrop = $('backdrop'), sheet = $('sheet'), sheetTitle = $('sheetTitle'), sheetBody = $('sheetBody'), sheetClose = $('sheetClose');
const detailPage = $('detailPage'), detailBody = $('detailBody'), detailTitle = $('detailTitle');
const detailBack = $('detailBack'), detailShare = $('detailShare');
const toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl);

const API = 'https://graphql.anilist.co';
const STORE_KEY = 'anime_v41_watchlist';
const SETTINGS_KEY = 'anime_v41_settings';
const STATUS_LIST = ['watching','planning','completed','dropped'];
const STATUS_LABELS = { watching:'Đang xem', planning:'Dự định', completed:'Đã xong', dropped:'Bỏ' };
const GENRES = ['Action','Adventure','Comedy','Drama','Fantasy','Romance','Sci-Fi','Slice of Life','Sports','Supernatural'];
const FORMATS = [{v:'TV',l:'TV'},{v:'MOVIE',l:'Movie'},{v:'OVA',l:'OVA'},{v:'ONA',l:'ONA'}];
const STATUSES = [{v:'RELEASING',l:'Đang chiếu'},{v:'FINISHED',l:'Đã xong'},{v:'NOT_YET_RELEASED',l:'Sắp ra mắt'}];
const SORTS = [{v:'POPULARITY_DESC',l:'Phổ biến'},{v:'SCORE_DESC',l:'Điểm cao'},{v:'TRENDING_DESC',l:'Trending'}];

let state = { tab:'home', season:'now', currentId:null, searchTimer:null, currentPage:1, filters:{}, detailTab:'overview', detailData:null };

function toast(msg, kind) { toastEl.textContent = msg; toastEl.className = 'toast show ' + (kind||''); setTimeout(() => toastEl.classList.remove('show'), 2200); }
function haptic() { if (navigator.vibrate) navigator.vibrate(8); }
function pickCover(c) { return c ? (c.extraLarge || c.large || c.medium || '') : ''; }
function fmtNum(n) { return (n||0).toLocaleString('vi-VN'); }

function getStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; } }
function setStore(o) { localStorage.setItem(STORE_KEY, JSON.stringify(o)); }
function getEntry(id) { return getStore()[id] || null; }
function setEntry(id, entry) { const s = getStore(); s[id] = entry; setStore(s); }

// --- HỆ THỐNG GỌI API AN TOÀN (GET OPTIMIZED) ---
async function gql(query, variables) {
    try {
        const url = new URL(API);
        url.searchParams.append('query', query);
        if (variables) url.searchParams.append('variables', JSON.stringify(variables));
        const res = await fetch(url, { method: 'GET', headers: { 'Accept': 'application/json' } });
        if (res.ok) {
            const data = await res.json();
            if (data?.data) return data;
        }
    } catch (e) {}

    // Fallback sang POST nếu GET lỗi
    const resPost = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ query, variables })
    });
    if (!resPost.ok) throw new Error('HTTP ' + resPost.status);
    return await resPost.json();
}

async function fetchSchedule() {
    const now = Math.floor(Date.now()/1000), in7 = now + 7*24*3600;
    const d = await gql(`query ($from:Int, $to:Int) {
        Page(page:1, perPage:40) { airingSchedules(airingAt_greater:$from, airingAt_lesser:$to, sort:TIME) {
            id airingAt timeUntilAiring episode mediaId
            media { id title { romaji english } coverImage { medium large } averageScore popularity genres }
        } }
    }`, { from:now, to:in7 });
    return (d?.data?.Page?.airingSchedules || []).map(s => ({
        id:s.id, mediaId:s.mediaId, airingAt:s.airingAt, timeUntilAiring:s.timeUntilAiring, episode:s.episode,
        title: s.media?.title?.english || s.media?.title?.romaji || '?',
        cover: pickCover(s.media?.coverImage), score: s.media?.averageScore || 0, genres: s.media?.genres || []
    }));
}

async function fetchTopList(sort, status) {
    const vars = { sort: [sort], perPage: 15 };
    let q = `query ($sort:[MediaSort], $perPage:Int) { Page(page:1, perPage:$perPage) { media(type:ANIME, sort:$sort) { id title { romaji english } coverImage { medium large } averageScore popularity genres } } }`;
    if (status) { vars.status = status; q = `query ($sort:[MediaSort], $perPage:Int, $status:MediaStatus) { Page(page:1, perPage:$perPage) { media(type:ANIME, sort:$sort, status:$status) { id title { romaji english } coverImage { medium large } averageScore popularity genres } } }`; }
    const d = await gql(q, vars);
    return (d?.data?.Page?.media || []).map(m => ({ id:m.id, title: m.title?.english || m.title?.romaji || '?', cover: pickCover(m.coverImage), score: m.averageScore || 0, genres: m.genres || [] }));
}

function currentSeason() { const m = new Date().getMonth() + 1; return m <= 3 ? 'WINTER' : m <= 6 ? 'SPRING' : m <= 9 ? 'SUMMER' : 'FALL'; }

async function fetchSeason(season, year) {
    const d = await gql(`query ($season:MediaSeason, $year:Int) { Page(page:1, perPage:20) { media(type:ANIME, season:$season, seasonYear:$year, sort:POPULARITY_DESC) { id title { romaji english } coverImage { medium large } averageScore popularity genres } } }`, { season, year });
    return (d?.data?.Page?.media || []).map(m => ({ id:m.id, title: m.title?.english || m.title?.romaji || '?', cover: pickCover(m.coverImage), score: m.averageScore || 0, genres: m.genres || [] }));
}

async function fetchSearch(q) {
    if (!q.trim()) return [];
    const d = await gql(`query ($q:String) { Page(page:1, perPage:20) { media(type:ANIME, search:$q) { id title { romaji english } coverImage { medium large } averageScore popularity genres status episodes } } }`, { q });
    return (d?.data?.Page?.media || []).map(m => ({ id:m.id, title: m.title?.english || m.title?.romaji || '?', cover: pickCover(m.coverImage), score: m.averageScore || 0, genres: m.genres || [], status: m.status, episodes: m.episodes }));
}

async function fetchBrowse(filters, page) {
    const vars = { page, perPage: 20 };
    const conds = ['type:ANIME'];
    if (filters.genre) { vars.genre = filters.genre; conds.push('genre:$genre'); }
    if (filters.year) { vars.year = +filters.year; conds.push('seasonYear:$year'); }
    if (filters.format) { vars.format = filters.format; conds.push('format:$format'); }
    if (filters.status) { vars.status = filters.status; conds.push('status:$status'); }
    vars.sort = filters.sort ? [filters.sort] : ['POPULARITY_DESC'];
    const d = await gql(`query ($page:Int, $perPage:Int, $genre:String, $year:Int, $format:MediaFormat, $status:MediaStatus, $sort:[MediaSort]) { Page(page:$page, perPage:$perPage) { pageInfo { hasNextPage } media(type:ANIME, genre:$genre, seasonYear:$year, format:$format, status:$status, sort:$sort) { id title { romaji english } coverImage { medium large } averageScore genres status episodes format seasonYear } } }`, vars);
    return { items: (d?.data?.Page?.media || []).map(m => ({ id:m.id, title: m.title?.english || m.title?.romaji || '?', cover: pickCover(m.coverImage), score: m.averageScore || 0, genres: m.genres || [], status:m.status, episodes:m.episodes, format:m.format, year:m.seasonYear })), hasNext: d?.data?.Page?.pageInfo?.hasNextPage || false };
}

async function fetchDetail(id) {
    const d = await gql(`query ($id:Int) {
        Media(id:$id, type:ANIME) {
            id title { romaji english } description(asHtml:false)
            coverImage { extraLarge large } bannerImage
            averageScore popularity favourites rank genres
            studios { edges { isMain node { name } } }
            episodes duration status format seasonYear
            startDate { year month day } endDate { year month day }
            relations { edges { relationType node { id title { romaji english } coverImage { medium large } averageScore seasonYear } } }
            characters(sort: ROLE, perPage: 12) { edges { role node { id name { full } image { large } } voiceActors { name { full } } } }
        }
    }`, { id });
    return d?.data?.Media || null;
}

// --- RENDER GIAO DIỆN ---
function renderSkeleton() { mainEl.innerHTML = `<div class="skeleton-hero"></div><div class="section"><div class="hscroll" style="padding:8px 16px;gap:12px">${Array(3).fill('<div style="flex:0 0 140px;aspect-ratio:2/3;background:var(--fill);border-radius:12px"></div>').join('')}</div></div>`; }

function posterCard(m) {
    const b = document.createElement('button'); b.className = 'poster';
    b.innerHTML = `<div class="img-wrap">${m.cover ? `<img src="${m.cover}" loading="lazy">` : ''}${m.score ? `<span class="score-badge">${m.score}</span>` : ''}</div><div class="info"><div class="t">${m.title}</div><div class="m">${(m.genres||[]).slice(0,2).join(' · ')}</div></div>`;
    b.onclick = () => { haptic(); openDetail(m.id); };
    return b;
}

function scheduleRow(s) {
    const b = document.createElement('button'); b.className = 'row';
    const st = getEntry(s.mediaId)?.status;
    b.innerHTML = `<div class="thumb">${s.cover ? `<img src="${s.cover}" loading="lazy">` : ''}</div><div class="txt"><div class="title">${s.title}</div><div class="desc">Tập ${s.episode} · ${new Date(s.airingAt*1000).toLocaleDateString('vi-VN', {weekday:'short', hour:'2-digit', minute:'2-digit'})}${st ? ' · ' + STATUS_LABELS[st] : ''}</div><div class="countdown ${s.timeUntilAiring < 3600 ? 'soon' : ''}">Còn ${Math.floor(s.timeUntilAiring/3600)} giờ</div></div><div class="chevron"></div>`;
    b.onclick = () => { haptic(); openDetail(s.mediaId); };
    return b;
}

async function renderHome() {
    renderSkeleton();
    try {
        const [trending, schedule] = await Promise.all([fetchTopList('TRENDING_DESC'), fetchSchedule()]);
        const hero = trending[0];
        const now = Math.floor(Date.now()/1000);
        const today = schedule.filter(s => s.airingAt < now + 86400).slice(0, 5);
        const secHTML = (t) => `<div class="section"><div class="section-head"><h3>${t}</h3></div><div class="hscroll" data-sec="${t}"></div></div>`;

        mainEl.innerHTML = `
            ${hero ? `<div class="hero"><img src="${hero.cover}"><div class="hero-overlay"><h2>${hero.title}</h2><p>${hero.genres.join(' · ')}</p><button class="btn" id="heroBtn">Xem chi tiết</button></div></div>` : ''}
            ${secHTML('Đang Thịnh Hành')}
            <div class="section"><div class="section-head"><h3>Hôm nay</h3></div><div class="list" id="todayList"></div></div>
            ${secHTML('Mùa này')}
            ${secHTML('Điểm cao nhất')}
        `;
        if (hero) $('heroBtn').onclick = () => openDetail(hero.id);

        const tc = mainEl.querySelector('.hscroll[data-sec="Đang Thịnh Hành"]');
        if (tc) trending.forEach(m => tc.appendChild(posterCard(m)));

        const tl = $('todayList');
        if (today.length) today.forEach(s => tl.appendChild(scheduleRow(s)));
        else tl.innerHTML = '<div style="padding:16px;color:var(--label2)">Không có tập nào hôm nay.</div>';

        fetchSeason(state.season === 'now' ? currentSeason() : state.season, new Date().getFullYear()).then(list => {
            const c = mainEl.querySelector('.hscroll[data-sec="Mùa này"]');
            if (c) list.forEach(m => c.appendChild(posterCard(m)));
        });
        fetchTopList('SCORE_DESC').then(list => {
            const c = mainEl.querySelector('.hscroll[data-sec="Điểm cao nhất"]');
            if (c) list.forEach(m => c.appendChild(posterCard(m)));
        });
    } catch (e) {
        mainEl.innerHTML = `<div style="padding:32px;text-align:center;color:var(--red)">Lỗi kết nối API. <button class="btn" onclick="renderHome()">Thử lại</button></div>`;
    }
}

async function renderSchedule() {
    renderSkeleton();
    try {
        const schedule = await fetchSchedule();
        const byDay = {};
        schedule.forEach(s => {
            const key = new Date(s.airingAt * 1000).toLocaleDateString('vi-VN', { weekday:'long', day:'2-digit', month:'2-digit' });
            if (!byDay[key]) byDay[key] = [];
            byDay[key].push(s);
        });
        mainEl.innerHTML = '';
        Object.entries(byDay).forEach(([day, items]) => {
            const sec = document.createElement('div'); sec.className = 'section';
            sec.innerHTML = `<div class="section-head"><h3>${day}</h3></div>`;
            const list = document.createElement('div'); list.className = 'list';
            items.forEach(s => list.appendChild(scheduleRow(s)));
            sec.appendChild(list); mainEl.appendChild(sec);
        });
    } catch (e) { mainEl.innerHTML = '<div style="padding:32px;text-align:center;color:var(--red)">Không tải được lịch.</div>'; }
}

function renderSearch() {
    mainEl.innerHTML = `<div class="section"><div class="section-head"><h3>Khám phá</h3><button id="openFilters">Bộ lọc</button></div><div class="list" id="searchResults" style="margin-top:0"></div></div>`;
    const resultsEl = $('searchResults');$('openFilters').onclick = openFiltersSheet;

    const doSearch = async (val) => {
        if (val.trim()) {
            resultsEl.innerHTML = '<div style="padding:16px;color:var(--label2)">Đang tìm...</div>';
            const list = await fetchSearch(val);
            resultsEl.innerHTML = '';
            if (!list.length) { resultsEl.innerHTML = '<div style="padding:16px;color:var(--label2)">Không tìm thấy kết quả.</div>'; return; }
            list.forEach(m => resultsEl.appendChild(searchRow(m)));
        } else {
            const f = state.filters;
            if (Object.keys(f).some(k => f[k])) {
                resultsEl.innerHTML = '<div style="padding:16px;color:var(--label2)">Đang lọc...</div>';
                const r = await fetchBrowse(f, 1);
                resultsEl.innerHTML = '';
                if (!r.items.length) { resultsEl.innerHTML = '<div style="padding:16px;color:var(--label2)">Không có kết quả phù hợp.</div>'; return; }
                r.items.forEach(m => resultsEl.appendChild(searchRow(m)));
            } else {
                resultsEl.innerHTML = '<div style="padding:16px;color:var(--label2)">Nhập từ khóa tìm kiếm hoặc chọn bộ lọc phía trên.</div>';
            }
        }
    };

    qEl.oninput = () => { clearTimeout(state.searchTimer); state.searchTimer = setTimeout(() => doSearch(qEl.value), 350); };
    doSearch(qEl.value);
}

function searchRow(m) {
    const row = document.createElement('button'); row.className = 'row';
    row.innerHTML = `<div class="thumb">${m.cover ? `<img src="${m.cover}" loading="lazy">` : ''}</div><div class="txt"><div class="title">${m.title}</div><div class="desc">${(m.genres||[]).join(' · ')}${m.episodes?' · '+m.episodes+' tập':''}</div></div><div class="chevron"></div>`;
    row.onclick = () => { haptic(); openDetail(m.id); };
    return row;
}

function openFiltersSheet() {
    sheetTitle.textContent = 'Bộ lọc nâng cao';
    const f = state.filters;
    let html = `<h3 style="margin:8px 0 4px;font-size:15px">Thể loại</h3><div class="tag-list" id="fGenres">`;
    GENRES.forEach(g => html += `<button class="chip ${f.genre===g?'active':''}" data-g="${g}">${g}</button>` );
    html += `</div><h3 style="margin:16px 0 4px;font-size:15px">Năm</h3><input type="number" class="rating-input" id="fYear" value="${f.year||''}" placeholder="VD: 2024">`;
    html += `<h3 style="margin:16px 0 4px;font-size:15px">Sắp xếp</h3><div class="tag-list" id="fSort">`;
    SORTS.forEach(s => html += `<button class="chip ${f.sort===s.v?'active':''}" data-s="${s.v}">${s.l}</button>` );
    html += `</div><button class="btn" id="applyF" style="margin-top:20px">Áp dụng</button>`;
    sheetBody.innerHTML = html;

    sheetBody.querySelectorAll('#fGenres button').forEach(b => b.onclick = () => { b.classList.toggle('active'); f.genre = b.classList.contains('active') ? b.dataset.g : undefined; });
    sheetBody.querySelectorAll('#fSort button').forEach(b => b.onclick = () => { sheetBody.querySelectorAll('#fSort button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); f.sort = b.dataset.s; });
    $('applyF').onclick = () => { f.year = $('fYear').value ? +$('fYear').value : undefined; closeSheet(); renderSearch(); };
    backdrop.classList.add('open'); sheet.classList.add('open');
}

function renderSaved() {
    const store = getStore();
    const ids = Object.keys(store).filter(id => store[id]?.status);
    if (!ids.length) { mainEl.innerHTML = `<div style="text-align:center;padding:48px"><div style="font-size:18px;font-weight:600">Chưa lưu anime nào</div><p style="color:var(--label2)">Hãy đánh dấu trạng thái khi xem chi tiết anime.</p></div>`; return; }
    mainEl.innerHTML = `<div class="section"><div class="section-head"><h3>Đã lưu (${ids.length})</h3></div><div class="list" id="savedList"></div></div>`;
    const list = $('savedList');
    ids.forEach(id => {
        const e = store[id];
        const row = document.createElement('button'); row.className = 'row';
        row.innerHTML = `<div class="thumb"></div><div class="txt"><div class="title">Anime #${id}</div><div class="desc">${STATUS_LABELS[e.status]||e.status}</div></div><div class="chevron"></div>`;
        row.onclick = () => openDetail(+id);
        list.appendChild(row);
        gql(`query ($id:Int){ Media(id:$id,type:ANIME){ id title{romaji english} coverImage{medium} } }`, { id:+id }).then(d => {
            const m = d?.data?.Media; if(!m) return;
            row.querySelector('.title').textContent = m.title?.english || m.title?.romaji;
            const src = pickCover(m.coverImage);
            if(src) row.querySelector('.thumb').innerHTML = `<img src="${src}" loading="lazy">`;
        });
    });
}

function renderSettings() {
    mainEl.innerHTML = `<div class="section"><div class="section-head"><h3>Cài đặt</h3></div><div class="list">
        <button class="row" onclick="localStorage.removeItem('${STORE_KEY}'); sessionStorage.clear(); toast('Đã xóa bộ nhớ','success');"><div class="txt"><div class="title" style="color:var(--red)">Xóa toàn bộ dữ liệu & Cache</div></div><div class="chevron"></div></button>
        <div class="row" style="cursor:default"><div class="txt"><div class="title">Phiên bản</div><div class="desc">Anime Schedule v4.1 Full Features</div></div></div>
    </div></div>`;
}

async function openDetail(id) {
    state.currentId = id; state.detailTab = 'overview';
    detailPage.classList.add('open'); document.body.style.overflow = 'hidden';
    detailBody.innerHTML = '<div style="padding:32px;text-align:center">Đang tải...</div>';
    try {
        const m = await fetchDetail(id);
        state.detailData = m;
        if (!m) { detailBody.innerHTML = '<div style="padding:32px;text-align:center;color:var(--red)">Không tìm thấy.</div>'; return; }
        detailTitle.textContent = m.title?.english || m.title?.romaji;
        renderDetailTab();
    } catch(e) { detailBody.innerHTML = '<div style="padding:32px;text-align:center;color:var(--red)">Lỗi tải chi tiết.</div>'; }
}

function renderDetailTab() {
    const m = state.detailData; if (!m) return;
    const tab = state.detailTab;
    const entry = getEntry(m.id) || {};

    let tabs = `<div class="segmented">`;
    [['overview','Tổng quan'],['characters','Nhân vật'],['relations','Quan hệ']].forEach(([k,l]) => tabs += `<button data-dtab="${k}" class="${tab===k?'active':''}">${l}</button>` );
    tabs += `</div>`;

    const banner = m.bannerImage || pickCover(m.coverImage);
    const poster = pickCover(m.coverImage);

    let head = banner ? `<img class="detail-banner" src="${banner}">` : '';
    head += `<div class="detail-head"><img class="poster-img" src="${poster}"><div class="meta-col"><h2>${detailTitle.textContent}</h2><div style="font-size:13px;color:var(--label2)">Điểm: <strong>${m.averageScore||'—'}</strong> · Hạng: <strong>#${m.rank||'—'}</strong></div></div></div>`;

    detailBody.innerHTML = head + tabs + `<div id="detailTabContent"></div>`;
    detailBody.querySelectorAll('[data-dtab]').forEach(b => b.onclick = () => { state.detailTab = b.dataset.dtab; renderDetailTab(); });

    const cEl = $('detailTabContent');
    if (tab === 'overview') {
        let html = `<div class="detail-section"><h3>Thông tin</h3><div class="info-grid">
            <div class="info-item"><div class="lbl">Studio</div><div class="val">${m.studios?.edges?.[0]?.node?.name||'—'}</div></div>
            <div class="info-item"><div class="lbl">Số tập</div><div class="val">${m.episodes||'—'}</div></div>
            <div class="info-item"><div class="lbl">Trạng thái</div><div class="val">${m.status||'—'}</div></div>
            <div class="info-item"><div class="lbl">Năm</div><div class="val">${m.seasonYear||'—'}</div></div>
        </div><h3>Thể loại</h3><div class="tag-list">${(m.genres||[]).map(g=>`<span class="tag accent">${g}</span>`).join('')}</div>
        <h3>Mô tả</h3><p>${m.description ? m.description.replace(/<[^>]*>?/gm, '') : 'Không có mô tả.'}</p>
        <h3>Theo dõi</h3><div class="status-buttons">`;
        STATUS_LIST.forEach(st => html += `<button class="chip ${entry.status===st?'active':''}" data-st="${st}">${STATUS_LABELS[st]}</button>`);
        html += `</div></div>`;
        cEl.innerHTML = html;
        cEl.querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
            const st = b.dataset.st;
            const cur = getEntry(m.id) || {};
            setEntry(m.id, { ...cur, status: cur.status === st ? '' : st });
            haptic(); toast('Đã cập nhật trạng thái', 'success'); renderDetailTab();
        });
    } else if (tab === 'characters') {
        const chars = m.characters?.edges || [];
        let html = `<div class="detail-section"><h3>Nhân vật (${chars.length})</h3><div class="char-grid">`;
        chars.forEach(c => {
            html += `<div class="char-item"><img src="${c.node.image?.large||''}" loading="lazy"><div class="n">${c.node.name?.full}</div><div class="r">${c.role}</div></div>`;
        });
        html += `</div></div>`;
        cEl.innerHTML = html;
    } else if (tab === 'relations') {
        const rels = m.relations?.edges || [];
        let html = `<div class="detail-section"><h3>Quan hệ</h3><div class="rel-list">`;
        rels.forEach(r => {
            html += `<button class="rel-item" data-goto="${r.node.id}"><img src="${pickCover(r.node.coverImage)}" loading="lazy"><div><div class="n">${r.node.title?.english||r.node.title?.romaji}</div><div class="rt">${r.relationType} · ${r.node.seasonYear||''}</div></div></button>`;
        });
        html += `</div></div>`;
        cEl.innerHTML = html;
        cEl.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => openDetail(+b.dataset.goto));
    }
}

function closeDetail() { detailPage.classList.remove('open'); document.body.style.overflow = ''; }
detailBack.onclick = closeDetail;
detailShare.onclick = () => { if(navigator.share) navigator.share({url:`https://anilist.co/anime/${state.currentId}`}); else { navigator.clipboard.writeText(`https://anilist.co/anime/${state.currentId}`); toast('Đã copy link','success'); } };

function closeSheet() { backdrop.classList.remove('open'); sheet.classList.remove('open'); }
sheetClose.onclick = closeSheet; backdrop.onclick = closeSheet;

tabbar.onclick = e => {
    const b = e.target.closest('.tab'); if(!b) return;
    state.tab = b.dataset.tab;
    tabbar.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); b.classList.add('active');
    $('searchWrap').style.display = (state.tab === 'search' || state.tab === 'home') ? '' : 'none';
    seasonChips.style.display = state.tab === 'home' ? '' : 'none';
    if (state.tab === 'home') renderHome();
    else if (state.tab === 'schedule') renderSchedule();
    else if (state.tab === 'search') renderSearch();
    else if (state.tab === 'saved') renderSaved();
    else if (state.tab === 'settings') renderSettings();
};

seasonChips.onclick = e => {
    const b = e.target.closest('.chip'); if(!b) return;
    seasonChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); b.classList.add('active');
    state.season = b.dataset.season; renderHome();
};

$('searchWrap').style.display = 'none';
renderHome();
</script>
